aid: datapad
name: Datapad
description: >-
  Datapad is an autonomous AI data analyst platform that lets business teams
  analyze their data by asking questions in natural language. It connects to
  50+ data sources — SQL databases, BigQuery, Snowflake, Google Ads, Facebook
  Ads, Shopify, HubSpot and more — and uses Text2SQL and Python code generation
  (powered by models such as Claude and ChatGPT) to turn questions into
  queries, dashboards, and insights, with a Slack bot for conversational
  analytics. Datapad is a San Francisco company backed by a16z. It is an
  end-user SaaS product and does not currently publish a public developer
  REST/GraphQL API, SDKs, or webhook surface; this profile captures its
  identity, security, and compliance posture.
